title = "Miller gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Public model catalog identifiers in the sidecar conformance lanes are not credentials."
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = [
  '''(?i)"(?:key|pins_id)"\s*:\s*"(?:qwen3-0\.6b-f16|bge-small-f32|bge-small-en-v1\.5-f32)"'''
]
