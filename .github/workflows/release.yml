name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, with or without leading v'
        required: true
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: false
        default: true
        type: boolean
      publish:
        description: 'Publish or update the GitHub release'
        required: false
        default: false
        type: boolean
      allow_overwrite:
        description: 'Allow overwriting an existing non-prerelease release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            rid: osx-arm64
            runner: macos-14
          - target: x86_64-apple-darwin
            rid: osx-x64
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            rid: linux-x64
            runner: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            rid: win-x64
            runner: windows-2025

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart("v")
            $isPrerelease = $version.Contains("-")
          } else {
            $raw = "${{ inputs.version }}"
            if ([string]::IsNullOrWhiteSpace($raw)) {
              throw "workflow_dispatch input 'version' is required"
            }
            $version = $raw.TrimStart("v")
            $tag = "v$version"
            $isPrerelease = [System.Convert]::ToBoolean("${{ inputs.prerelease }}")
          }

          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_PRERELEASE=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore Miller.slnx

      - name: Restore julie-extract (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/restore-julie-extract.sh

      - name: Restore julie-extract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/restore-julie-extract.ps1

      - name: Publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/publish/${{ matrix.target }}"
          $dashboardDir = Join-Path $publishDir "dashboard"
          dotnet publish src/Miller.Server/Miller.Server.csproj `
            -c Release `
            -r "${{ matrix.rid }}" `
            --self-contained true `
            -p:PublishAot=true `
            -p:JsonSerializerIsReflectionEnabledByDefault=false `
            -p:Version=$env:RELEASE_VERSION `
            -o $publishDir
          # ASP.NET Razor Components do not currently support Native AOT; keep the packaged dashboard
          # self-contained while the main miller binary is AOT.
          dotnet publish src/Miller.Dashboard/Miller.Dashboard.csproj `
            -c Release `
            -r "${{ matrix.rid }}" `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -p:Version=$env:RELEASE_VERSION `
            -o $dashboardDir
          $dashboardTools = Join-Path $dashboardDir ".tools"
          if (Test-Path $dashboardTools) {
            Remove-Item $dashboardTools -Recurse -Force
          }

      - name: Verify packaged Unix extractor
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="${GITHUB_WORKSPACE}/artifacts/publish/${{ matrix.target }}"
          test -x "${publish_dir}/miller"
          test -x "${publish_dir}/.tools/julie-extract"
          test ! -e "${publish_dir}/.tools/julie-extract.exe"
          test -x "${publish_dir}/dashboard/Miller.Dashboard"
          test -f "${publish_dir}/dashboard/wwwroot/dashboard.css"
          test ! -e "${publish_dir}/dashboard/.tools/julie-extract"
          "${publish_dir}/.tools/julie-extract" --version
          "${publish_dir}/miller" version
          reqs=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
          # printf '%s\n' (not '%s'): $(...) strips trailing newlines, so the final tools/list request
          # would otherwise reach the line-delimited MCP transport unterminated and never be parsed.
          stderr_file="$(mktemp)"
          # Linux Native AOT cold startup on GitHub runners can exceed the old 6s window even though
          # the binary is valid. Keep stdin open long enough for a real tools/list response, and
          # preserve stderr so a future failure shows the server-side reason.
          out=$( ( printf '%s\n' "$reqs"; sleep 20 ) | "${publish_dir}/miller" serve 2>"${stderr_file}" || true )
          # Assert against the tools/list RESPONSE (id:2), not the initialize capabilities — "tools" alone
          # would false-positive on the {"tools":{"listChanged":true}} capability in the initialize reply.
          echo "$out" | grep -q '"id":2' || {
            echo "AOT MCP serve smoke failed: no tools/list response"
            sed -n '1,120p' "${stderr_file}"
            exit 1
          }
          for tool in search inspect context impact trace edit content workspace; do
            echo "$out" | grep -q "\"name\":\"${tool}\"" || {
              echo "AOT MCP serve smoke failed: ${tool} tool missing"
              sed -n '1,120p' "${stderr_file}"
              exit 1
            }
          done

      - name: Verify packaged Windows extractor
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/publish/${{ matrix.target }}"
          $millerBinary = Join-Path $publishDir "miller.exe"
          $windowsBinary = Join-Path $publishDir ".tools/julie-extract.exe"
          $unixBinary = Join-Path $publishDir ".tools/julie-extract"
          if (-not (Test-Path $millerBinary)) {
            throw "missing packaged Windows miller.exe"
          }
          if (-not (Test-Path $windowsBinary)) {
            throw "missing packaged Windows julie-extract.exe"
          }
          if (Test-Path $unixBinary) {
            throw "Windows package must not include Unix julie-extract"
          }
          $dashboardBinary = Join-Path $publishDir "dashboard/Miller.Dashboard.exe"
          $dashboardCss = Join-Path $publishDir "dashboard/wwwroot/dashboard.css"
          $dashboardTools = Join-Path $publishDir "dashboard/.tools"
          if (-not (Test-Path $dashboardBinary)) {
            throw "missing packaged Windows dashboard executable"
          }
          if (-not (Test-Path $dashboardCss)) {
            throw "missing packaged dashboard CSS"
          }
          if (Test-Path $dashboardTools) {
            throw "dashboard package must not include a duplicate .tools directory"
          }
          & $windowsBinary --version
          & $millerBinary version

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="${GITHUB_WORKSPACE}/artifacts/publish/${{ matrix.target }}"
          package_name="miller-${RELEASE_VERSION}-${{ matrix.target }}"
          package_root="${GITHUB_WORKSPACE}/artifacts/package"
          package_dir="${package_root}/${package_name}"
          release_dir="${GITHUB_WORKSPACE}/artifacts/release"

          rm -rf "${package_root}" "${release_dir}"
          mkdir -p "${package_dir}" "${release_dir}"
          rsync -a "${publish_dir}/" "${package_dir}/"
          cp "${GITHUB_WORKSPACE}/LICENSE" "${package_dir}/LICENSE"
          cp "${GITHUB_WORKSPACE}/THIRD-PARTY-NOTICES.md" "${package_dir}/THIRD-PARTY-NOTICES.md"
          find "${package_dir}" -type f \( -name '*.pdb' -o -name '*.dbg' \) -delete
          find "${package_dir}" -name '*.dSYM' -type d -prune -exec rm -rf {} +
          chmod +x "${package_dir}/miller" "${package_dir}/.tools/julie-extract" "${package_dir}/dashboard/Miller.Dashboard"
          test -f "${package_dir}/LICENSE"
          test -f "${package_dir}/THIRD-PARTY-NOTICES.md"
          archive="${release_dir}/${package_name}.tar.gz"
          tar -czf "${archive}" -C "${package_root}" "${package_name}"
          (cd "${release_dir}" && shasum -a 256 "${package_name}.tar.gz" > "${package_name}.tar.gz.sha256")
          ls -lh "${release_dir}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/publish/${{ matrix.target }}"
          $packageName = "miller-$env:RELEASE_VERSION-${{ matrix.target }}"
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/package"
          $packageDir = Join-Path $packageRoot $packageName
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/release"

          Remove-Item $packageRoot, $releaseDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageDir, $releaseDir | Out-Null
          Get-ChildItem -Path $publishDir -Force | Copy-Item -Destination $packageDir -Recurse -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "LICENSE") -Destination (Join-Path $packageDir "LICENSE") -Force
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE "THIRD-PARTY-NOTICES.md") -Destination (Join-Path $packageDir "THIRD-PARTY-NOTICES.md") -Force
          Get-ChildItem -Path $packageDir -Recurse -Filter *.pdb | Remove-Item -Force
          if (-not (Test-Path (Join-Path $packageDir "LICENSE"))) {
            throw "missing packaged LICENSE"
          }
          if (-not (Test-Path (Join-Path $packageDir "THIRD-PARTY-NOTICES.md"))) {
            throw "missing packaged THIRD-PARTY-NOTICES.md"
          }
          $archive = Join-Path $releaseDir "$packageName.zip"
          Compress-Archive -Path $packageDir -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $packageName.zip" | Set-Content -Encoding ascii (Join-Path $releaseDir "$packageName.zip.sha256")
          Get-ChildItem $releaseDir | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: miller-${{ matrix.target }}
          path: artifacts/release/*
          if-no-files-found: error

  github-release:
    name: publish GitHub release
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: miller-*
          path: artifacts/release
          merge-multiple: true

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            prerelease=false
            if [[ "${version}" == *-* ]]; then
              prerelease=true
            fi
          else
            raw="${{ inputs.version }}"
            version="${raw#v}"
            tag="v${version}"
            prerelease="${{ inputs.prerelease }}"
          fi
          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"
          echo "RELEASE_PRERELEASE=${prerelease}" >> "${GITHUB_ENV}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_OVERWRITE: ${{ inputs.allow_overwrite }}
        shell: bash
        run: |
          set -euo pipefail
          ls -lh artifacts/release
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            is_prerelease="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .prerelease)"
            is_draft="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .draft)"
            if [ "${is_prerelease}" = "false" ] && [ "${is_draft}" = "false" ] && [ "${ALLOW_OVERWRITE:-false}" != "true" ]; then
              echo "Refusing to overwrite published release ${RELEASE_TAG}. Re-run with allow_overwrite=true to force."; exit 1
            fi
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq .id)"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="Miller ${RELEASE_TAG}" \
              -f body="Miller ${RELEASE_TAG}" \
              -F prerelease="${RELEASE_PRERELEASE}" >/dev/null
            gh release upload "${RELEASE_TAG}" artifacts/release/* --clobber
          else
            args=(
              gh release create "${RELEASE_TAG}" artifacts/release/*
              --target "${GITHUB_SHA}"
              --title "Miller ${RELEASE_TAG}"
              --notes "Miller ${RELEASE_TAG}"
              --latest=false
            )
            if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
              args+=(--prerelease)
            fi
            "${args[@]}"
          fi

  package-only:
    name: package-only validation
    needs: build
    if: github.event_name == 'workflow_dispatch' && !inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Skipping GitHub release publication; packaged artifacts were uploaded for validation."
