name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  build-test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 2

      - name: Whitespace and conflict-marker guard
        run: git diff --check HEAD^ HEAD

      - name: AGENTS.md sync guard
        run: |
          bash scripts/sync-agents.sh
          git diff --exit-code AGENTS.md

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - name: Test plugin distribution metadata
        run: scripts/test-plugin.sh

      - name: Test site token-savings utility
        run: node --test tests/site-token-savings/*.test.mjs

      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Miller.slnx

      - name: Build (warnings are errors via Directory.Build.props)
        run: dotnet build Miller.slnx --no-restore -c Release

      # Default suite = unit + contract. Scale/integration tests are [Trait("Category","Scale")] and excluded here;
      # they run in a separate scheduled job. Local dev-loop target is <10s; the CI ceiling below is generous to
      # absorb runner variance while still catching the runaway-suite death spiral that nearly killed julie
      # (julie-eros-audit §4). Tighten the ceiling as the real suite grows.
      - name: Test (default suite, time-budgeted)
        run: |
          start=$(date +%s)
          dotnet test Miller.slnx --no-build -c Release --filter "Category!=Scale"
          elapsed=$(( $(date +%s) - start ))
          echo "Default suite wall time: ${elapsed}s (local target <10s, CI ceiling 30s)"
          if [ "$elapsed" -gt 30 ]; then
            echo "::error::Default test suite took ${elapsed}s (>30s CI ceiling). Investigate slow tests or tag them [Trait(\"Category\",\"Scale\")]."
            exit 1
          fi

  scale-test:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore julie-extract
        run: bash scripts/restore-julie-extract.sh

      - name: Test (Scale suite)
        run: scripts/test.sh scale

  windows-fast:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Miller.slnx

      - name: Restore julie-extract (Windows)
        shell: pwsh
        run: ./scripts/restore-julie-extract.ps1

      - name: Build (warnings are errors via Directory.Build.props)
        run: dotnet build Miller.slnx --no-restore -c Release

      - name: Test (default suite via PowerShell wrapper)
        shell: pwsh
        env:
          # Windows hosted runners are much slower than local/Ubuntu for test discovery/execution, and restore/build
          # consume ~2 minutes before this step starts. Two clean hosted runs completed in 619s and 637s, so keep
          # normal runner variance below the 15-minute job timeout while still catching a true runaway.
          FAST_BUDGET_SECONDS: 720
        run: |
          $ErrorActionPreference = 'Continue'
          $results = Join-Path $PWD 'TestResults'
          $start = Get-Date
          dotnet test Miller.slnx --no-build -c Release --filter "Category!=Scale" `
            --results-directory "$results" `
            --blame-hang --blame-hang-timeout 120s --blame-hang-dump-type none
          $code = $LASTEXITCODE
          $elapsed = [int][Math]::Ceiling(((Get-Date) - $start).TotalSeconds)
          Write-Host "Default suite wall time: ${elapsed}s (Windows CI ceiling ${env:FAST_BUDGET_SECONDS}s)"

          if ($code -ne 0) {
            Get-ChildItem -Path "$results" -Recurse -Filter 'Sequence*.xml' -ErrorAction SilentlyContinue |
              ForEach-Object {
                Write-Host "::group::Blame sequence $($_.FullName)"
                Get-Content $_.FullName
                Write-Host "::endgroup::"
              }
            exit $code
          }

          if ($elapsed -gt [int]$env:FAST_BUDGET_SECONDS) {
            Write-Error "Default test suite took ${elapsed}s (>${env:FAST_BUDGET_SECONDS}s Windows CI ceiling). Investigate slow tests or tag them [Trait(`"Category`",`"Scale`")]."
            exit 1
          }

  windows-scale-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-dotnet@v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Miller.slnx

      - name: Restore julie-extract (Windows)
        shell: pwsh
        run: ./scripts/restore-julie-extract.ps1

      - name: Build (warnings are errors via Directory.Build.props)
        run: dotnet build Miller.slnx --no-restore -c Release

      - name: "Test (Windows scale smoke: leadership, WAL, full rebuild, live bridges)"
        shell: pwsh
        run: >
          dotnet test Miller.slnx --no-build -c Release
          --filter "FullyQualifiedName~VersionAwareLeadershipScaleTests|FullyQualifiedName~MultiProcessWalTests|FullyQualifiedName~FullRebuildScanScaleTests|FullyQualifiedName~LiveBridgeTraceTests"
