[workspace]
members = ["codesearch-core", "codesearch-extractors", "codesearch-ffi"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["murphy"]
license = "MIT"

[workspace.dependencies]
# Core
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
futures = "0.3"

# Search
lancedb = "0.15"
tantivy = "0.22"

# Parsing - will add tree-sitter deps when we copy extractors

# FFI
uniffi = "0.28"

# Utilities
blake3 = "1.5"
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
